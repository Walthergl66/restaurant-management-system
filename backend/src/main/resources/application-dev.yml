spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurante}
    username: ${DB_USER:restaurante}
    password: ${DB_PASSWORD}
  jpa:
    # Descomenta solo para depurar SQL puntual: el sondeo programado del outbox
    # (cada 2s) vuelve la consola ilegible con show-sql activo.
    # show-sql: true
    properties:
      hibernate:
        format_sql: true

# El secreto JWT NO vive en el repositorio en ningún perfil: se lee siempre de
# la variable de entorno JWT_SECRET (mínimo 32 caracteres). Sin default para que
# la app se niegue a arrancar en lugar de firmar tokens con una clave conocida.
# Para desarrollo local: cp .env.example .env y genera una con
#   openssl rand -hex 64
app:
  jwt:
    secret: ${JWT_SECRET}
  inicial:
    admin-password: ${ADMIN_INITIAL_PASSWORD:admin123}
  cors:
    # Solo en desarrollo: el frontend Next.js proxea /api/* desde el servidor
    # (next.config.ts), asi que ni siquiera hace falta abrir CORS para el
    # desarrollo local habitual. Se abre para poder depurar desde un cliente de
    # navegador served desde otro origen (Swagger UI, Postman web, etc.).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# La base deja esto cerrado (fail-closed) y el perfil lo abre a proposito:
# documentacion interactiva y metricas solo mientras se desarrolla.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.restaurante: DEBUG
