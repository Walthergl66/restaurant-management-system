spring:
  # Carga el archivo .env (gitignored) como properties. Las variables de
  # entorno reales del sistema tienen prioridad sobre este archivo.
  #
  # La ruta es relativa al DIRECTORIO DE TRABAJO, y el .env vive en backend/:
  # arrancando desde la raiz del repo (como documenta el README) solo existe
  # backend/.env, y arrancando desde backend/ solo existe ./.env. Se intentan
  # las dos; ambas son `optional` para no fallar en Docker/CI donde no existe.
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: restaurant-management-system
  # NO se fija spring.profiles.active aquí a propósito: con un perfil por
  # defecto la app arrancaba en 'dev' (secreto y ajustes laxos) en cualquier
  # despliegue que no lo eligiera explícitamente. El perfil se elige solo por
  # entorno (SPRING_PROFILES_ACTIVE=dev|prod) o con -Dspring.profiles.active.
  datasource:
    # La base de datos vive en otra máquina, así que la conexión cruza la red:
    #   - sslmode=require obliga a cifrar TLS siempre (si el servidor no lo
    #     soporta, falla en vez de degradar a texto plano). Para una instancia
    #     local sin certificados hay que poner DB_SSLMODE=disable a mano.
    #   - connectTimeout/socketTimeout evitan que un corte de red deje hilos del
    #     pool bloqueados para siempre (socketTimeout=0 significa "infinito").
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurante}?sslmode=${DB_SSLMODE:require}&connectTimeout=10&socketTimeout=60
    username: ${DB_USER:restaurante}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

# La documentación OpenAPI se publica solo en los perfiles que lo piden (hoy,
# 'dev'). Motivo: la app NO tiene perfil por defecto, así que la base es la
# configuración de una instancia a la que nadie eligió perfil, y esa instancia
# no debe quedar más expuesta que 'prod'. En la base no se sirve nada.
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 'env' y 'configprops' NUNCA se exponen: permitirían volcar el valor
        # resuelto de app.jwt.secret. Solo 'health' como mínimo vital.
        include: health
  endpoint:
    health:
      # Sin detalles (BD, disco) ni siquiera para usuarios autenticados: los
      # revela el perfil que lo pida, no la base.
      show-details: never

app:
  cors:
    # Sin valor por defecto a propósito: una instancia sin perfil no acepta
    # orígenes de navegador (fail-closed). El perfil 'dev' lo abre a '*' y
    # 'prod' exige la variable sin comodín.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}       # 1 hora (A-04: ventana corta)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días
  iva:
    rate: ${IVA_RATE:0.15}   # 15% incluido en los precios de catálogo
  dinero:
    scale: 2
    rounding-mode: HALF_UP
  impresion:
    # Opción 1 del plan: backend en la nube + agente local
    reintentos-max: 3
    intervalo-reintentos-ms: 5000

  # Correo transaccional (RF-45): envío del código de verificación de correo.
  # La aplicación NO habla con SMTP ni con el proveedor directamente en la capa
  # de aplicación: lo hace el adaptador que resuelva este puerto (EmisorCorreo).
  mail:
    # Interruptor maestro. false (por defecto) = el código sale por el adaptador
    #   de log (EmisorCorreoLog): modo desarrollo, sin salir de la aplicación.
    #   "Sin configurar nada, nada cambia": este es el valor que arranca quien
    #   no declare MAIL_ENABLED.
    # true = el envío real, vía API del proveedor (Resend en desarrollo).
    enabled: ${MAIL_ENABLED:false}
    # Clave API del proveedor (Resend: re_...). OBLIGATORIA si enabled=true:
    #   en el perfil prod, ProdSecretsValidator detiene el arranque si falta.
    #   Se suministra SOLO por entorno, nunca en el repositorio.
    api-key: ${RESEND_API_KEY:}
    # Remitente (MAIL_FROM) y nombre visible (MAIL_FROM_NAME). Sin dominio
    #   verificado en Resend el remitente es el de prueba onboarding@resend.dev,
    #   que solo entrega al correo de la propia cuenta; al verificar un dominio
    #   bastará cambiar MAIL_FROM, sin tocar código.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:}
    # Timeouts de la llamada HTTP al proveedor (ms). Cortos a propósito: un
    #   correo no debe colgar la petición; el envío va además tras el commit.
    connect-timeout-ms: ${MAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MAIL_READ_TIMEOUT_MS:10000}
