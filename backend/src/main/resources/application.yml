spring:
  application:
    name: restaurant-management-system
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurante}
    username: ${DB_USERNAME:restaurante}
    password: ${DB_PASSWORD:restaurante}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 horas
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días
  iva:
    rate: ${IVA_RATE:0.15}   # 15% incluido en los precios de catálogo
  dinero:
    scale: 2
    rounding-mode: HALF_UP
  impresion:
    # Opción 1 del plan: backend en la nube + agente local
    reintentos-max: 3
    intervalo-reintentos-ms: 5000