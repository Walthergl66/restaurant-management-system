spring:
  # Carga backend/.env como archivo de propiedades (gitignored). Las variables
  # de entorno reales del sistema tienen prioridad sobre este archivo.
  # `optional` evita fallar en Docker/CI donde no existe .env.
  config:
    import: optional:file:.env[.properties]
  application:
    name: restaurant-management-system
  # NO se fija spring.profiles.active aquí a propósito: con un perfil por
  # defecto la app arrancaba en 'dev' (secreto y ajustes laxos) en cualquier
  # despliegue que no lo eligiera explícitamente. El perfil se elige solo por
  # entorno (SPRING_PROFILES_ACTIVE=dev|prod) o con -Dspring.profiles.active.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurante}
    username: ${DB_USER:restaurante}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}       # 1 hora (A-04: ventana corta)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días
  iva:
    rate: ${IVA_RATE:0.15}   # 15% incluido en los precios de catálogo
  dinero:
    scale: 2
    rounding-mode: HALF_UP
  impresion:
    # Opción 1 del plan: backend en la nube + agente local
    reintentos-max: 3
    intervalo-reintentos-ms: 5000
