<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Código de verificación</title>
</head>
<body style="margin:0;padding:24px;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:460px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;border:1px solid #e4e6ea;">
    <h2 style="margin:0 0 16px;color:#1f2937;font-size:20px;">Tu código de verificación</h2>
    <p style="margin:0 0 20px;color:#4b5563;font-size:15px;line-height:1.5;">
      Introduce el siguiente código para confirmar tu correo electrónico:
    </p>
    <p style="margin:0 0 20px;padding:18px;text-align:center;background:#f3f4f6;border-radius:6px;">
      <span style="font-size:34px;font-weight:bold;letter-spacing:10px;color:#111827;">{{codigo}}</span>
    </p>
    <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.5;">
      Caduca en 30 minutos. Si no solicitaste este correo, puedes ignorarlo;
      nadie puede acceder a tu cuenta sin este código.
    </p>
  </div>
</body>
</html>
