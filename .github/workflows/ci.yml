name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar
        run: ./mvnw --no-transfer-progress -B clean package -DskipTests

      - name: Test (Testcontainers con PostgreSQL real)
        run: ./mvnw --no-transfer-progress -B test