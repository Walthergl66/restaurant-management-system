# Complemento local: docker compose -f docker-compose.yml -f docker-compose.archivos.yml up -d --build backend
services:
  backend:
    environment:
      DB_NAME: ${ARCHIVOS_DB_NAME:-restaurante_archivos}
      ARCHIVOS_HABILITADO: "true"
      ARCHIVOS_HOST: ${ARCHIVOS_HOST:-192.168.100.77}
      ARCHIVOS_USUARIO: archivosapp
      ARCHIVOS_CLAVE_PRIVADA: /run/archivos/archivos_backend
      ARCHIVOS_KNOWN_HOSTS: /run/archivos/known_hosts
      ARCHIVOS_LECTURA_URL: ${ARCHIVOS_LECTURA_URL:-http://192.168.100.77/media/}
    volumes:
      - ./backend/.local/ssh:/run/archivos:ro
