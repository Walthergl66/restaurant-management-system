services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurante-postgres
    environment:
      POSTGRES_DB: restaurante
      POSTGRES_USER: restaurante
      POSTGRES_PASSWORD: restaurante
    ports:
      - "5432:5432"
    volumes:
      - restaurante-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurante -d restaurante"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  restaurante-pgdata: