services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurante-backend
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    # La conexion externa se configura con DB_* en backend/.env.
    # El .env de la raiz tiene prioridad si define las mismas variables.
    # No fijar DB_* aqui: sobrescribiria las credenciales de env_file.
    environment:
      SERVER_PORT: 8080
      # Perfil explícito: la app ya no tiene perfil por defecto (a propósito),
      # así que se declara aquí en lugar de depender de heredar el de .env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # JWT_SECRET NO se declara acá: una línea en `environment:` con
      # ${JWT_SECRET:-} (vacío si no está exportada) pisaría el valor real que
      # llega del env_file backend/.env. El secreto sale solo de ahí.
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8080
    container_name: restaurante-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-7070}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
