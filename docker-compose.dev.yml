services:

  # ── 1. Base de datos ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: restaurante-postgres
    environment:
      POSTGRES_DB:       ${DB_NAME:-restaurante}
      POSTGRES_USER:     ${DB_USER:-restaurante}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restaurante}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - restaurante-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-restaurante} -d ${DB_NAME:-restaurante}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - restaurante-net

  # ── 2. Backend Spring Boot ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurante-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-restaurante}
      DB_USER:     ${DB_USER:-restaurante}
      DB_PASSWORD: ${DB_PASSWORD:-restaurante}
      JWT_SECRET:             ${JWT_SECRET:-estacion_burger_dev_secret_key_2022_neon}
      JWT_EXPIRATION_MS:      ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS:   "*"
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - restaurante-net

  # ── 3. Frontend Next.js ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurante-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV:    production
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      PORT:        3000
      HOSTNAME:    "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - restaurante-net

volumes:
  restaurante-pgdata:

networks:
  restaurante-net:
    driver: bridge
