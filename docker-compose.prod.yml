services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurante-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?DB_HOST obligatorio}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME obligatorio}
      DB_USER: ${DB_USER:?DB_USER obligatorio}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obligatorio}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe tener al menos 32 caracteres}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}   # 1 hora (plan mejoras 3); antes 24h
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD obligatorio en prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS obligatorio en prod (dominios reales, sin *)}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
