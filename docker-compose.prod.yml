services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurante-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-restaurante}
      POSTGRES_USER: ${DB_USERNAME:-restaurante}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restaurante}
    volumes:
      - restaurante-pgdata-prod:/var/lib/postgresql/data
      - ./database/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-restaurante} -d ${DB_NAME:-restaurante}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurante-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-restaurante}
      DB_USERNAME: ${DB_USERNAME:-restaurante}
      DB_PASSWORD: ${DB_PASSWORD:-restaurante}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe tener al menos 32 caracteres}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD obligatorio en prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  restaurante-pgdata-prod:
